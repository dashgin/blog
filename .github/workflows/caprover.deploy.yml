name: Build App & Deploy

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Plans in the works to create tarball from within the caprover/deploy-from-github action.
      - uses: a7ul/tar-action@v1.2.0
        with:
          command: c
          cwd: "./"
          files: |
            ./backend
          outPath: deploy.tar

      - uses: caprover/deploy-from-github@main
        with:
          server: '${{ vars.CAPROVER_SERVER }}'
          app: '${{ vars.APP_NAME }}'
          token: '${{ secrets.APP_TOKEN }}'