name: Build Backend & Deploy to CapRover

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"

  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Plans in the works to create tarball from within the caprover/deploy-from-github action.
      - uses: a7ul/tar-action@v1.2.0
        with:
          command: c
          cwd: "./"
          files: |
            ./backend
          outPath: deploy.tar

      - uses: caprover/deploy-from-github@main
        with:
          server: '${{ vars.CAPROVER_SERVER }}'
          app: '${{ vars.CAPROVER_APP_NAME }}'
          token: '${{ vars.CAPROVER_APP_TOKEN }}'
